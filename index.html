<style>
  :root{

  body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:14px}
  #map{position:absolute;inset:0;background:#e8eef3}

  /* ---------- Pencarian ---------- */
  .search{position:absolute;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:56px;max-width:480px}

  .search-row{display:flex;align-items:center;gap:8px;border:1.5px solid var(--accent);border-radius:8px;padding:0 10px;height:40px}
  .search-row svg{flex:none;width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:2}
  .search-row input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:var(--ink)}
  .search-row button{border:0;background:none;font-size:20px;line-height:1;color:var(--ink-2);cursor:pointer;display:none;padding:0 2px}
  .search-tip{margin:6px 2px 0;font-size:12px;color:var(--ink-2);line-height:1.35}
  .search-tip a{color:var(--accent);cursor:pointer;text-decoration:underline}
  .results{margin-top:6px;background:var(--paper);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
  .results button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--wash);cursor:pointer;font:inherit;color:inherit}
  .results button:hover,.results button:focus-visible{background:var(--wash);outline:0}
  .results .dot{flex:none;width:11px;height:11px;border-radius:50%;margin-top:4px}
  .results b{display:block;font-weight:600}
  .results small{color:var(--ink-2);font-size:12px}
  .results .empty{padding:12px;color:var(--ink-2)}

  .leaflet-control-layers{border:0!important;border-radius:10px!important;box-shadow:var(--shadow)!important;font-family:inherit}

  .leaflet-control-layers-separator{margin:7px -4px!important}
  .lg-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 6px 0 2px;vertical-align:-1px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .lg-line{display:inline-block;width:16px;height:0;border-top:2.5px solid #0f5c8c;margin:0 6px 0 0;vertical-align:3px}
  .lg-n{color:var(--ink-2);font-size:12px}

  table.pop .muted{color:#8593a1;font-style:italic}
  .coord{font-variant-numeric:tabular-nums}
  .foto{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--wash);cursor:zoom-in}
  .foto-none{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border-radius:6px;background:var(--wash);color:#8593a1;font-size:12px;text-align:center;padding:8px}

/* ---------- Titik sarana ibadah ---------- */
const grup = {}, hitung = {}, semuaMarker = [];
Object.keys(JENIS).forEach(k => { grup[k] = L.layerGroup(); hitung[k] = 0; });
const canvas = L.canvas({padding:.5, tolerance:6});

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function isiPopup(d){
  const w = JENIS[d.j].warna;
  const alas = d.ah ? esc(d.ah) : '<span class="muted">Belum ada data</span>';
  const wilayah = [d.kl && 'Kel. ' + esc(d.kl), d.kc && 'Kec. ' + esc(d.kc)].filter(Boolean).join(', ') || '-';
  const koord = d.la.toFixed(7) + ', ' + d.lo.toFixed(7);
  const gmaps = 'https://www.google.com/maps?q=' + d.la + ',' + d.lo;
  const box = document.createElement('div');
  box.innerHTML =
    `<div class="pop-h" style="background:${w}">${esc(d.n)}<small>${esc(d.j)} · No. ${d.no}</small></div>
     <div class="pop-b"><table class="pop">
       <tr><th>Alamat</th><td>${esc(d.a)}</td></tr>
       <tr><th>Wilayah</th><td>${wilayah}</td></tr>
       <tr><th>Alas Hak</th><td>${alas}</td></tr>
       <tr><th>Koordinat</th><td class="coord">${koord}</td></tr>
       <tr><th>Foto</th><td class="foto-wrap"></td></tr>
     </table></div>
     <div class="pop-f"><a href="${gmaps}" target="_blank" rel="noopener">Buka di Google Maps</a></div>`;
  muatFoto(box.querySelector('.foto-wrap'), d);
  return box;
}

function muatFoto(wadah, d){
  let n = 0;
  const img = new Image();
  img.className = 'foto'; img.alt = 'Foto ' + d.n; img.loading = 'lazy';
  img.onerror = () => {
    n++;
    if (n < CONFIG.fotoExt.length) img.src = CONFIG.fotoFolder + d.i + '.' + CONFIG.fotoExt[n];
    else wadah.innerHTML = '<div class="foto-none">Foto belum tersedia<br>(' + CONFIG.fotoFolder + d.i + '.jpg)</div>';
  };
  img.onclick = () => bukaLightbox(img.src);
  img.src = CONFIG.fotoFolder + d.i + '.' + CONFIG.fotoExt[0];
  wadah.appendChild(img);
}

DATA.forEach(d => {
  if (!JENIS[d.j]) return;
  const m = L.circleMarker([d.la, d.lo], {
    renderer:canvas, radius:6, color:'#fff', weight:1.4, fillColor:JENIS[d.j].warna, fillOpacity:.95
  });
  m.bindPopup(() => isiPopup(d), {autoPanPadding:[20,70]});
  m.on('mouseover', () => m.setStyle({radius:9}));
  m.on('mouseout',  () => m.setStyle({radius:6}));
  m.addTo(grup[d.j]);
  hitung[d.j]++;
  semuaMarker.push({d, m});
});
Object.values(grup).forEach(g => g.addTo(map));

  const lyr = L.geoJSON(gj, {
    renderer: canvas,
    style: f => {
      const ada = kecData.has(norm(f.properties.NAME_3));
      return {color:ada?'#0f5c8c':'#8a97a5', weight:ada?2:1.2, dashArray:ada?null:'4 4',
              fillColor:'#0f5c8c', fillOpacity:ada?.05:0};
    },
    onEachFeature: (f, l) => {
      l.bindTooltip(f.properties.NAME_3, {permanent:true, direction:'center', className:'kec-label'});
      l.on('mouseover', () => l.setStyle({fillOpacity:.14}));
      l.on('mouseout',  () => lyr.resetStyle(l));
    }
  });
  kecLayer.addLayer(lyr);
  lyr.bringToBack();
  Object.values(grup).forEach(g => g.eachLayer(m => m.bringToFront()));
}
function ambilKecamatan(){
  fetch(CONFIG.kecamatanFile).then(r => { if(!r.ok) throw 0; return r.json(); })
    .catch(() => fetch(CONFIG.kecamatanOnline).then(r => r.json()))
    .then(gj => { if(!gj.features || !gj.features.length) throw 0; tampilkanKecamatan(gj); })
    .catch(() => toast('Batas kecamatan gagal dimuat. Taruh file GADM di ' + CONFIG.kecamatanFile, 6000));
}
ambilKecamatan();
function atur(){ document.body.classList.toggle('hide-kec-label', map.getZoom() > 15); }
map.on('zoomend', atur); atur();

/* ---------- Kontrol layer ---------- */
const basemaps = {
  'Jalan (Esri)':esriJalan, 'Topografi (Esri)':esriTopo, 'Abu-abu terang (Esri)':esriTerang,
  'Abu-abu gelap (Esri)':esriGelap, 'Citra satelit (Esri)':citra, 'OpenStreetMap (hanya jika online di hosting)':osm
};
const overlays = {};
Object.keys(JENIS).forEach(k => {
  overlays[`<span class="lg-dot" style="background:${JENIS[k].warna}"></span>${k} <span class="lg-n">${hitung[k]}</span>`] = grup[k];
});
overlays['<span class="lg-line"></span>Batas kecamatan (GADM)'] = kecLayer;
const kontrol = L.control.layers(basemaps, overlays, {collapsed:window.innerWidth < 700, position:'topright'}).addTo(map);

/* ---------- Fit ke data ---------- */
map.fitBounds(L.latLngBounds(DATA.map(d => [d.la, d.lo])), {padding:[30,30]});

/* ---------- Pencarian ---------- */
const q = document.getElementById('q'), qx = document.getElementById('qx'), hasil = document.getElementById('results');
let penanda = null;

function tutupHasil(){ hasil.style.display = 'none'; hasil.innerHTML = ''; }
function parseKoordinat(t){
  const m = t.match(/(-?\d{1,3}(?:[.,]\d+)?)\s*[,;\s]\s*(?:lng:|lon:|long:)?\s*(-?\d{1,3}(?:[.,]\d+)?)/i);
  if(!m) return null;
  const la = parseFloat(m[1].replace(',', '.')), lo = parseFloat(m[2].replace(',', '.'));
  return (Math.abs(la) <= 90 && Math.abs(lo) <= 180) ? [la, lo] : null;
}
function keKoordinat(la, lo){
  if (penanda) map.removeLayer(penanda);
  penanda = L.marker([la, lo]).addTo(map)
    .bindPopup(`<div class="pop-h" style="background:#14263a">Titik koordinat<small>${la.toFixed(6)}, ${lo.toFixed(6)}</small></div>
      <div class="pop-f"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${la},${lo}">Buka di Google Maps</a></div>`)
    .openPopup();
  map.flyTo([la, lo], 18, {duration:.8});
}
function keSarana(item){
  const {d, m} = item;
  if (!map.hasLayer(grup[d.j])) grup[d.j].addTo(map);
  map.flyTo([d.la, d.lo], 18, {duration:.8});
  map.once('moveend', () => m.openPopup());
}
function cari(){
  const t = q.value.trim();
  qx.style.display = t ? 'block' : 'none';
  if(!t){ tutupHasil(); return; }
  const k = /^[\s\-\d.,;:a-z]*$/i.test(t) && /\d/.test(t) ? parseKoordinat(t.replace(/lat\s*,?\s*lon\s*:/i,'')) : null;
  let html = '';
  if (k) html += `<button data-k="${k[0]},${k[1]}"><span class="dot" style="background:#14263a"></span><span><b>Ke koordinat ${k[0]}, ${k[1]}</b><small>Zoom ke titik ini</small></span></button>`;
  const kata = t.toLowerCase().split(/\s+/);
  const cocok = semuaMarker.filter(({d}) => {
    const s = (d.n + ' ' + d.a + ' ' + d.kl + ' ' + d.kc + ' ' + d.j).toLowerCase();
    return kata.every(w => s.includes(w));
  }).slice(0, 8);
  cocok.forEach(item => {
    const d = item.d, idx = semuaMarker.indexOf(item);
    html += `<button data-s="${idx}"><span class="dot" style="background:${JENIS[d.j].warna}"></span><span><b>${esc(d.n)}</b><small>${esc(d.j)} · ${esc(d.kl || '-')}, ${esc(d.kc)}</small></span></button>`;
  });
  if (!html) html = '<div class="empty">Tidak ada hasil. Coba nama lain atau koordinat.</div>';
  hasil.innerHTML = html; hasil.style.display = 'block';
}
q.addEventListener('input', cari);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ const b = hasil.querySelector('button'); if (b) b.click(); }
  if (e.key === 'Escape'){ tutupHasil(); q.blur(); }
});
qx.onclick = () => { q.value=''; cari(); q.focus(); if (penanda){ map.removeLayer(penanda); penanda=null; } };
hasil.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.k){ const [la,lo] = b.dataset.k.split(',').map(Number); keKoordinat(la, lo); }
  else keSarana(semuaMarker[+b.dataset.s]);
  tutupHasil(); q.blur();
});
document.getElementById('ex').onclick = () => { q.value = '-7.2575,112.7521'; cari(); };
map.on('click', tutupHasil);
L.DomEvent.disableClickPropagation(document.querySelector('.search'));
L.DomEvent.disableScrollPropagation(hasil);

/* ---------- Lightbox & toast ---------- */
const lb = document.getElementById('lightbox');
function bukaLightbox(src){ lb.querySelector('img').src = src; lb.classList.add('on'); }
lb.onclick = e => { if (e.target === lb || e.target.tagName === 'BUTTON') lb.classList.remove('on'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });
function toast(t, ms){
  const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', ms || 3000);
}
</script>
</body>
</html>
